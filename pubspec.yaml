name: paisa_exe
description: "Paisa.exe — an offline-first VIT student money companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  share_plus: ^13.3.1
  cross_file: ^0.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.18
  shared_preferences_android: 2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/paisa_logo_tintable.png
    - assets/images/paisa_logo_transparent.png
    - assets/images/paisa_wallet_hero.png
